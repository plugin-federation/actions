name: "MCP tool judge pipeline"
description: >-
  End-to-end Nexus dogfood for an MCP tools/list: record the tool catalog,
  load judges from Nexus, fingerprint tools, run LLM-as-judge in CI for
  pending tools only, and record assessments. Scores are 0–100; pass/fail
  is score >= judge passThreshold. Requires id-token: write (for OIDC
  upstream) and provider API keys in the job env.
author: "Plugin Federation"
branding:
  icon: check-circle
  color: purple

inputs:
  nexus-url:
    description: >-
      Nexus base URL. Defaults to production. Use
      https://api.nonprod.plugin-federation.com for nonprod.
    required: false
    default: "https://api.plugin-federation.com"
  console-url:
    description: >-
      Console base URL for catalog deep links. Empty derives from nexus-url
      (api.* → console.*).
    required: false
    default: ""
  tenant-id:
    required: true
  source-id:
    required: true
  access-token:
    description: "Nexus token from nexus-oidc-exchange"
    required: true
  tools-list-file:
    required: true
  source-version:
    description: "Catalog sourceVersion (default: github.sha)"
    required: false
    default: ""
  record-catalog:
    description: >-
      When true (default), POST the tools/list catalog to Nexus before judging
      and attach the returned catalogDigest to analyses.
    required: false
    default: "true"
  catalog-digest:
    description: >-
      Optional catalog digest override. Used when record-catalog is false, or
      as a fallback if the record step is skipped.
    required: false
    default: ""
  force-rerun:
    required: false
    default: "false"
  fail-on-judge-fail:
    description: >-
      If true, fail the step when any tool outcome is fail or error.
      warn outcomes are reported but do not fail the job by default.
    required: false
    default: "true"

outputs:
  fingerprints-file:
    value: ${{ steps.fp.outputs.output-file }}
  judges-file:
    value: ${{ steps.judges.outputs.output-file }}
  catalog-digest:
    description: "Content-addressed catalog digest (from record step or input)"
    value: ${{ steps.digest.outputs.catalog-digest }}
  catalog-console-url:
    description: "Console deep link for catalog evidence when catalog was recorded"
    value: ${{ steps.catalog.outputs.console-url }}
  source-version:
    value: ${{ steps.catalog.outputs.source-version }}

runs:
  using: composite
  steps:
    # Nested composite: use the published same-repo action (relative paths resolve
    # against the *caller* repo, not this actions monorepo).
    - name: Record tool catalog in Nexus
      id: catalog
      if: ${{ inputs.record-catalog == 'true' }}
      uses: plugin-federation/actions/nexus-record-tool-catalog@main
      with:
        nexus-url: ${{ inputs.nexus-url }}
        console-url: ${{ inputs.console-url }}
        tenant-id: ${{ inputs.tenant-id }}
        source-id: ${{ inputs.source-id }}
        access-token: ${{ inputs.access-token }}
        tools-list-file: ${{ inputs.tools-list-file }}
        source-version: ${{ inputs.source-version }}

    - name: Resolve catalog digest
      id: digest
      shell: bash
      env:
        RECORDED: ${{ steps.catalog.outputs.catalog-digest }}
        OVERRIDE: ${{ inputs.catalog-digest }}
        RECORD_CATALOG: ${{ inputs.record-catalog }}
      run: |
        set -euo pipefail
        DIGEST="${RECORDED:-}"
        if [[ -z "$DIGEST" ]]; then
          DIGEST="${OVERRIDE:-}"
        fi
        if [[ "$RECORD_CATALOG" == "true" && -z "$DIGEST" ]]; then
          echo "::error::record-catalog=true but no catalogDigest was produced"
          exit 1
        fi
        echo "catalog-digest=${DIGEST}" >> "$GITHUB_OUTPUT"
        if [[ -n "$DIGEST" ]]; then
          echo "Using catalogDigest=${DIGEST}"
        else
          echo "No catalogDigest (analyses will omit it)"
        fi

    - name: Fingerprint tools
      id: fp
      shell: bash
      env:
        INPUT_TOOLS_LIST_FILE: ${{ inputs.tools-list-file }}
        INPUT_OUTPUT_FILE: ${{ runner.temp }}/tool-fingerprints.json
      run: |
        set -euo pipefail
        node "${{ github.action_path }}/../mcp-tool-fingerprint/fingerprint.mjs"
        COUNT="$(jq '.tools | length' "${INPUT_OUTPUT_FILE}")"
        echo "output-file=${INPUT_OUTPUT_FILE}" >> "$GITHUB_OUTPUT"
        echo "tool-count=${COUNT}" >> "$GITHUB_OUTPUT"

    - name: List judges from Nexus
      id: judges
      shell: bash
      env:
        NEXUS_URL: ${{ inputs.nexus-url }}
        TENANT_ID: ${{ inputs.tenant-id }}
        ACCESS_TOKEN: ${{ inputs.access-token }}
        OUTPUT_FILE: ${{ runner.temp }}/tool-judges.json
      run: |
        set -euo pipefail
        echo "::add-mask::${ACCESS_TOKEN}"
        if [[ -z "${NEXUS_URL:-}" ]]; then
          NEXUS_URL="https://api.plugin-federation.com"
        fi
        NEXUS_URL="${NEXUS_URL%/}"
        HTTP_CODE="$(curl -sS -o "${RUNNER_TEMP}/judges-response.json" -w "%{http_code}" \
          -H "authorization: Bearer ${ACCESS_TOKEN}" \
          -H "accept: application/json" \
          "${NEXUS_URL}/api/v1/tenants/${TENANT_ID}/tool-judges?enabledOnly=true")"
        if [[ "$HTTP_CODE" != "200" ]]; then
          echo "::error::list tool judges failed (HTTP ${HTTP_CODE})"
          cat "${RUNNER_TEMP}/judges-response.json" || true
          exit 1
        fi
        jq '.' "${RUNNER_TEMP}/judges-response.json" > "${OUTPUT_FILE}"
        COUNT="$(jq '.items | length' "${OUTPUT_FILE}")"
        echo "output-file=${OUTPUT_FILE}" >> "$GITHUB_OUTPUT"
        echo "judge-count=${COUNT}" >> "$GITHUB_OUTPUT"
        echo "Fetched ${COUNT} enabled judges"

    - name: Run judges and record assessments
      shell: bash
      env:
        NEXUS_URL: ${{ inputs.nexus-url }}
        TENANT_ID: ${{ inputs.tenant-id }}
        SOURCE_ID: ${{ inputs.source-id }}
        ACCESS_TOKEN: ${{ inputs.access-token }}
        CATALOG_DIGEST: ${{ steps.digest.outputs.catalog-digest }}
        CATALOG_CONSOLE_URL: ${{ steps.catalog.outputs.console-url }}
        FORCE_RERUN: ${{ inputs.force-rerun }}
        FAIL_ON_FAIL: ${{ inputs.fail-on-judge-fail }}
        FP_FILE: ${{ steps.fp.outputs.output-file }}
        JUDGES_FILE: ${{ steps.judges.outputs.output-file }}
      run: |
        set -euo pipefail
        echo "::add-mask::${ACCESS_TOKEN}"
        if [[ -z "${NEXUS_URL:-}" ]]; then
          NEXUS_URL="https://api.plugin-federation.com"
        fi
        NEXUS_URL="${NEXUS_URL%/}"
        COUNT="$(jq '.items | length' "$JUDGES_FILE")"
        if [[ "$COUNT" == "0" ]]; then
          echo "::warning::No enabled tool judges on tenant — catalog recorded; configure judges via Console or POST /tool-judges"
          exit 0
        fi

        SUMMARY_ROWS="${RUNNER_TEMP}/judge-summary-rows.tsv"
        : > "$SUMMARY_ROWS"
        FAIL_COUNT=0
        FAIL_NAMES=()

        report_row() {
          # args: source judge_id name outcome score
          local source="$1" judge_id="$2" name="$3" outcome="$4" score="${5:-}"
          local score_label="${score:-—}"
          printf '%s\t%s\t%s\t%s\t%s\n' "$judge_id" "$name" "$score_label" "$outcome" "$source" >> "$SUMMARY_ROWS"
          echo "  ${name}: score=${score_label} outcome=${outcome} (${source})"
          if [[ "$outcome" == "fail" || "$outcome" == "error" ]]; then
            echo "::warning title=Judge ${judge_id} · ${name}::score=${score_label} outcome=${outcome} (${source})"
            FAIL_COUNT=$((FAIL_COUNT + 1))
            FAIL_NAMES+=("${name}[${judge_id}]=${score_label}/${outcome}")
          elif [[ "$outcome" == "warn" ]]; then
            echo "::warning title=Judge ${judge_id} · ${name}::score=${score_label} outcome=warn (${source}) — non-critical"
          else
            echo "::notice title=Judge ${judge_id} · ${name}::score=${score_label} outcome=${outcome} (${source})"
          fi
        }

        for i in $(seq 0 $((COUNT - 1))); do
          JUDGE_ID="$(jq -r --argjson i "$i" '.items[$i].judgeId' "$JUDGES_FILE")"
          JUDGE_VERSION="$(jq -r --argjson i "$i" '.items[$i].version' "$JUDGES_FILE")"
          THRESHOLD="$(jq -r --argjson i "$i" '.items[$i].passThreshold // 70' "$JUDGES_FILE")"
          WARN_T="$(jq -r --argjson i "$i" '.items[$i].warnThreshold // empty' "$JUDGES_FILE")"
          if [[ -n "$WARN_T" ]]; then
            echo "::group::Judge ${JUDGE_ID}@${JUDGE_VERSION} (passThreshold=${THRESHOLD}, warnThreshold=${WARN_T})"
          else
            echo "::group::Judge ${JUDGE_ID}@${JUDGE_VERSION} (passThreshold=${THRESHOLD})"
          fi

          LOOKUP_FILE="${RUNNER_TEMP}/lookup-${JUDGE_ID}.json"
          RESULTS_FILE="${RUNNER_TEMP}/results-${JUDGE_ID}.json"
          FORCE_JSON=false
          [[ "$FORCE_RERUN" == "true" ]] && FORCE_JSON=true

          jq -n \
            --arg judgeId "$JUDGE_ID" \
            --arg judgeVersion "$JUDGE_VERSION" \
            --argjson forceRerun "$FORCE_JSON" \
            --slurpfile fp "$FP_FILE" \
            '{
              judgeId: $judgeId,
              judgeVersion: $judgeVersion,
              forceRerun: $forceRerun,
              tools: $fp[0].tools
            }' > "${RUNNER_TEMP}/lookup-req.json"

          CODE="$(curl -sS -o "$LOOKUP_FILE" -w "%{http_code}" \
            -X POST "${NEXUS_URL}/api/v1/tenants/${TENANT_ID}/tool-sources/${SOURCE_ID}/tool-analyses/lookup" \
            -H "authorization: Bearer ${ACCESS_TOKEN}" \
            -H "content-type: application/json" \
            --data-binary @"${RUNNER_TEMP}/lookup-req.json")"
          if [[ "$CODE" != "200" ]]; then
            echo "::error::lookup failed for ${JUDGE_ID} HTTP ${CODE}"
            cat "$LOOKUP_FILE" || true
            exit 1
          fi

          PENDING_N="$(jq '.pending|length' "$LOOKUP_FILE")"
          ANALYZED_N="$(jq '.analyzed|length' "$LOOKUP_FILE")"
          echo "pending=${PENDING_N} analyzed=${ANALYZED_N}"

          # Always surface cached assessments (even when nothing is pending).
          if [[ "$ANALYZED_N" != "0" ]]; then
            echo "Cached assessments (from Nexus):"
            while IFS=$'\t' read -r name outcome score; do
              [[ -z "$name" ]] && continue
              report_row "cache" "$JUDGE_ID" "$name" "$outcome" "$score"
            done < <(jq -r '.analyzed[]? | [.name, .outcome, (if .score == null then "" else (.score|tostring) end)] | @tsv' "$LOOKUP_FILE")
          fi

          INPUT_JUDGES_FILE="$JUDGES_FILE" \
          INPUT_LOOKUP_FILE="$LOOKUP_FILE" \
          INPUT_FINGERPRINTS_FILE="$FP_FILE" \
          INPUT_OUTPUT_FILE="$RESULTS_FILE" \
          INPUT_CATALOG_DIGEST="$CATALOG_DIGEST" \
          INPUT_SOURCE_ID="$SOURCE_ID" \
          node "${{ github.action_path }}/../mcp-tool-judge/run-judge.mjs"

          ITEMS="$(jq '.items|length' "$RESULTS_FILE")"
          if [[ "$ITEMS" != "0" ]]; then
            CODE="$(curl -sS -o "${RUNNER_TEMP}/record-out.json" -w "%{http_code}" \
              -X POST "${NEXUS_URL}/api/v1/tenants/${TENANT_ID}/tool-sources/${SOURCE_ID}/tool-analyses" \
              -H "authorization: Bearer ${ACCESS_TOKEN}" \
              -H "content-type: application/json" \
              -H "idempotency-key: analyses-${JUDGE_ID}-${GITHUB_SHA:-x}-${GITHUB_RUN_ID:-0}" \
              -H "x-request-id: gha-${GITHUB_RUN_ID:-0}-${i}" \
              --data-binary @"$RESULTS_FILE")"
            if [[ "$CODE" != "201" && "$CODE" != "200" ]]; then
              echo "::error::record analyses failed for ${JUDGE_ID} HTTP ${CODE}"
              cat "${RUNNER_TEMP}/record-out.json" || true
              exit 1
            fi
            echo "Recorded ${ITEMS} new assessment(s) for ${JUDGE_ID} in Nexus"
            echo "New assessments (this run):"
            while IFS=$'\t' read -r name outcome score; do
              [[ -z "$name" ]] && continue
              report_row "new" "$JUDGE_ID" "$name" "$outcome" "$score"
            done < <(jq -r '.items[]? | [.name, .outcome, (if .score == null then "" else (.score|tostring) end)] | @tsv' "$RESULTS_FILE")
          elif [[ "$PENDING_N" != "0" ]]; then
            echo "::warning::pending=${PENDING_N} but no analysis items were produced"
          else
            echo "No pending tools — used Nexus cache only (nothing new to POST)"
          fi

          echo "::endgroup::"
        done

        # Job log + step summary table
        echo
        echo "======== Judge results ========"
        if [[ -s "$SUMMARY_ROWS" ]]; then
          printf '%-20s %-24s %6s %-8s %s\n' "JUDGE" "TOOL" "SCORE" "OUTCOME" "SOURCE"
          while IFS=$'\t' read -r judge name score outcome source; do
            printf '%-20s %-24s %6s %-8s %s\n' "$judge" "$name" "$score" "$outcome" "$source"
          done < "$SUMMARY_ROWS"
        else
          echo "(no assessment rows)"
        fi
        echo "================================"

        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          {
            echo "## LLM-as-judge results"
            echo
            if [[ -n "${CATALOG_DIGEST:-}" ]]; then
              echo "- **Catalog digest:** \`${CATALOG_DIGEST}\`"
            fi
            if [[ -n "${CATALOG_CONSOLE_URL:-}" ]]; then
              echo "- **Console:** [catalog evidence](${CATALOG_CONSOLE_URL})"
            fi
            echo
            echo "| Judge | Tool | Score | Outcome | Source |"
            echo "| --- | --- | ---: | --- | --- |"
            if [[ -s "$SUMMARY_ROWS" ]]; then
              while IFS=$'\t' read -r judge name score outcome source; do
                echo "| \`${judge}\` | \`${name}\` | ${score} | **${outcome}** | ${source} |"
              done < "$SUMMARY_ROWS"
            else
              echo "| — | — | — | — | — |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        if [[ "$FAIL_ON_FAIL" == "true" && "$FAIL_COUNT" -gt 0 ]]; then
          DETAIL="$(IFS=', '; echo "${FAIL_NAMES[*]}")"
          echo "::error::${FAIL_COUNT} tool(s) failed LLM judge (score below passThreshold or error): ${DETAIL}"
          exit 1
        fi
