name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# Requires Dependency graph (Settings → Code security). Until that is enabled
# for this repository, the job is soft-fail so Dependabot/CI is not blocked.
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@v5
