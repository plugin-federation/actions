name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mcp-tools-list-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-tools-list-validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 24 for --experimental-strip-types unit tests; Action runtime is node20.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mcp-tools-list-validate/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build and verify committed dist is fresh
        run: |
          npm run build
          git diff --exit-code -- dist/index.cjs \
            || (echo "::error::dist/index.cjs is stale; run npm run build and commit dist/" && exit 1)
      - name: Smoke Mode A (same entrypoint as the Action)
        # Paths resolve against GITHUB_WORKSPACE (Action contract), not job working-directory.
        run: node mcp-tools-list-validate/dist/index.cjs
        working-directory: ${{ github.workspace }}
        env:
          INPUT_TOOLS_LIST_FILE: mcp-tools-list-validate/fixtures/valid-tools-list.json
          INPUT_PROFILE: plugin-federation
          INPUT_REPORT_FILE: ${{ runner.temp }}/mcp-tools-list-report.json
          INPUT_GITHUB_ANNOTATIONS: "false"
