name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mcp-tools-list-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-tools-list-validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Maintainer CI only — consumer workflows that *use* this Action never run npm.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp-tools-list-validate/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build and verify committed dist is fresh
        run: |
          npm run build
          git diff --exit-code -- dist/index.cjs \
            || (echo "::error::dist/index.cjs is stale; run npm run build and commit dist/" && exit 1)
      - name: Smoke Mode A (same entrypoint as the Action)
        run: node dist/index.cjs
        env:
          INPUT_TOOLS_LIST_FILE: fixtures/valid-tools-list.json
          INPUT_PROFILE: plugin-federation
          INPUT_REPORT_FILE: /tmp/mcp-tools-list-report.json
          INPUT_GITHUB_ANNOTATIONS: "false"
