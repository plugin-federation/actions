name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mcp-tools-list-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-tools-list-validate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mcp-tools-list-validate/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Smoke Mode A fixture
        run: |
          node dist/index.js
        env:
          INPUT_TOOLS_LIST_FILE: fixtures/valid-tools-list.json
          INPUT_PROFILE: plugin-federation
          INPUT_REPORT_FILE: /tmp/mcp-tools-list-report.json
          INPUT_GITHUB_ANNOTATIONS: "false"
