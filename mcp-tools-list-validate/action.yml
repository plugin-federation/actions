name: "MCP tools/list validate"
description: "Validate MCP tools/list from a file or live MCP server (2025-06-18 + optional Plugin Federation limits)"
author: "Plugin Federation"
branding:
  icon: check-circle
  color: purple

# JavaScript Action: runs committed dist/index.cjs on Node 20 (deps bundled).

inputs:
  tools-list-file:
    description: "Mode A: path to tools list JSON (mutually exclusive with mcp-config-file)"
    required: false
    default: ""
  mcp-config-file:
    description: "Mode B: path to mcpServers JSON config (Claude Desktop / Cursor / VS Code format). Mutually exclusive with tools-list-file. Secrets via ${VAR} expanded from the job environment."
    required: false
    default: ""
  mcp-server:
    description: "Mode B: server key under mcpServers when the config defines more than one"
    required: false
    default: ""
  profile:
    description: "mcp | plugin-federation"
    required: false
    default: "plugin-federation"
  fail-on-warnings:
    description: "If true, warnings fail the step"
    required: false
    default: "false"
  fail-on-incomplete-list:
    description: "If true, residual nextCursor fails as error"
    required: false
    default: "false"
  report-file:
    description: "Path for JSON validation report"
    required: false
    default: "mcp-tools-list-report.json"
  sarif-file:
    description: "Optional SARIF output path (not yet implemented)"
    required: false
    default: ""
  github-annotations:
    description: "Emit GitHub workflow annotations"
    required: false
    default: "true"
  max-bytes:
    description: "Max Mode A file size and Mode B response body size (bytes)"
    required: false
    default: "20971520"
  max-tools:
    description: "Max tools (default 5000)"
    required: false
    default: ""
  max-pages:
    description: "Mode B: max tools/list pages to merge"
    required: false
    default: "50"
  timeout-ms:
    description: "Mode B: per-request timeout"
    required: false
    default: "30000"
  deadline-ms:
    description: "Mode B: overall client deadline"
    required: false
    default: "120000"
  allow-insecure-http:
    description: "Mode B: allow http:// URLs"
    required: false
    default: "false"
  allowed-hosts:
    description: "Mode B: optional comma-separated exact host allowlist"
    required: false
    default: ""
  mcp-schema-version:
    description: "MCP schema version pin"
    required: false
    default: "2025-06-18"

outputs:
  result:
    description: "pass | fail | error"
  error-count:
    description: "Number of error findings"
  warning-count:
    description: "Number of warning findings"
  tool-count:
    description: "Normalized tool count"
  report-file:
    description: "Absolute path to written report"
  tools-array-digest:
    description: "tools-array-v1 digest or empty"
  pf-tool-catalog-digest:
    description: "pf-tool-catalog-v1 digest or empty"
  input-mode:
    description: "file | live"

runs:
  using: node20
  main: dist/index.cjs
