name: "MCP tools/list validate"
description: "Validate MCP tools/list from a file or live MCP server (2025-06-18 + optional Plugin Federation limits). Zero consumer npm install — runs a pre-bundled dist."
author: "Plugin Federation"
branding:
  icon: check-circle
  color: purple

# Hermetic JavaScript Action:
# - No actions/setup-node
# - No npm install / npm ci on the consumer job
# - Runner executes committed dist/index.cjs with Node 20 (bundled Ajv and all deps)

inputs:
  tools-list-file:
    description: "Mode A: path to tools list JSON (mutually exclusive with mcp-config-file)"
    required: false
    default: ""
  mcp-config-file:
    description: "Mode B: path to MCP client config JSON (mutually exclusive with tools-list-file). Not implemented until a tagged release with Mode B."
    required: false
    default: ""
  profile:
    description: "mcp | plugin-federation"
    required: false
    default: "plugin-federation"
  fail-on-warnings:
    description: "If true, warnings fail the step"
    required: false
    default: "false"
  fail-on-incomplete-list:
    description: "If true, residual nextCursor fails as error"
    required: false
    default: "false"
  report-file:
    description: "Path for JSON validation report"
    required: false
    default: "mcp-tools-list-report.json"
  sarif-file:
    description: "Optional SARIF output path (not yet implemented)"
    required: false
    default: ""
  github-annotations:
    description: "Emit GitHub workflow annotations"
    required: false
    default: "true"
  max-bytes:
    description: "Max Mode A file size and Mode B response body size (bytes)"
    required: false
    default: "20971520"
  max-tools:
    description: "Max tools (default 5000)"
    required: false
    default: ""
  max-pages:
    description: "Mode B: max tools/list pages to merge"
    required: false
    default: "50"
  timeout-ms:
    description: "Mode B: per-request timeout"
    required: false
    default: "30000"
  deadline-ms:
    description: "Mode B: overall client deadline"
    required: false
    default: "120000"
  allow-insecure-http:
    description: "Mode B: allow http:// URLs"
    required: false
    default: "false"
  allowed-hosts:
    description: "Mode B: optional comma-separated exact host allowlist"
    required: false
    default: ""
  mcp-schema-version:
    description: "MCP schema version pin"
    required: false
    default: "2025-06-18"

outputs:
  result:
    description: "pass | fail | error"
  error-count:
    description: "Number of error findings"
  warning-count:
    description: "Number of warning findings"
  tool-count:
    description: "Normalized tool count"
  report-file:
    description: "Absolute path to written report"
  tools-array-digest:
    description: "tools-array-v1 digest or empty"
  pf-tool-catalog-digest:
    description: "pf-tool-catalog-v1 digest or empty"
  input-mode:
    description: "file | live"

runs:
  using: node20
  main: dist/index.cjs
